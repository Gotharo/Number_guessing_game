<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de Adivinar el Número</title>
    <link rel="stylesheet" href="styles/style.css">
</head>

<body>
    <h1 class="title">Guess the number</h1>
    <div id="game-container">
        <p id="output"> Iam thinking in a number between 0 and 99</p>
        <div class="main">
            <div class="graphics">
                <img src="./assets/img/arrow.png" alt="" id="arrow">
                <img src="./assets/img/scale.png" alt="" id="scale">
            </div>
            <div class="input-button">
                <input type="text" id="input" placeholder="Enter your guess here" autofocus>
                <button id="button">Guess</button>
            </div>
        </div>
        <p id="status"></p>
        <!-- Aquí irá el contenido del juego -->
    </div>
    <script src="scripts/script.js"></script>
</body>

</html>
